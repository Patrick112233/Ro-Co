############## README ##############
# Pleas be aware that the here provided file is the default configuration
# for the integration tests and gets overwritten by the inividual tests.
############## README ##############

#Debug:
#debug=true

# Server:
spring.application.name=ro-co-API
server.port=8080

#Documentation:
springdoc.swagger-ui.path=/api.html

########## MongoDB ##########:
spring.data.mongodb.database=RoCoDB
spring.data.mongodb.host=localhost
spring.data.mongodb.auto-index-creation= true
# Certificate of the CA that signed the certificate to login at MongoDB
tls.caFile.name=certs/RoCoRootCA.pem
# Client certificate to login at MongoDB
tls.certFile.name=certs/RoCoAPI.pem
# Client name to login at MongoDB, must exactly match the format expected by mongoDB (not the subject of the certificate)
security.x509.user=C=GE,ST=BY,L=Rosenheim,O=RoCo,OU=RoCoAPI,CN=RoCoAPI

########## General Security ##########:
# enforces certiciate validation if true
security.enabled=false
#Access key to local keystore
#security.keyPWD=${KEYPASS}


########## JWT Security ##########:
#PKCS8 private key using ES512 (Elliptic Curve Cryptography) for JWT verification
security.jwt.private-
#x508 public key cert using ES512 (Elliptic Curve Cryptography) for JWT signing
security.jwt.public-
# Expieration of JWT tokens in millisecond
security.jwt.expiration-time=3600000
security.jwt.expiration-refresh-time= 86400000

########## Rest Entpoint TLS Encryption ##########:
server.ssl.enabled=false
cors.allowed-origin=http://localhost:3000
